<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- CORS Headers for Google Sign-In -->
    <meta
      http-equiv="Cross-Origin-Opener-Policy"
      content="same-origin-allow-popups"
    />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />
    <meta http-equiv="Cross-Origin-Resource-Policy" content="cross-origin" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="job_tinder" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>job_tinder</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Google Sign-In Client ID -->
    <meta
      name="google-signin-client_id"
      content="499488421543-dqpsq3vag3cus0hme6lohd7vj5cjes5i.apps.googleusercontent.com"
    />

    <!-- Load Google API Client Library -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <!-- Suppress deprecation warnings and fix console issues -->
    <script>
      // Suppress the Intl.v8Breakiterator deprecation warning
      const originalConsoleWarn = console.warn;
      console.warn = function (...args) {
        const message = args.join(" ");
        if (
          message.includes("Intl.v8Breakiterator is deprecated") ||
          message.includes("signIn method is discouraged") ||
          message.includes("signIn method is deprecated")
        ) {
          return; // Suppress these specific warnings
        }
        originalConsoleWarn.apply(console, args);
      };

      // Suppress Google Sign-In specific warnings
      const originalConsoleError = console.error;
      console.error = function (...args) {
        const message = args.join(" ");
        if (
          message.includes("Cross-Origin-Opener-Policy") ||
          message.includes("OAuth token was not passed to gapi.client")
        ) {
          return; // Suppress these specific errors
        }
        originalConsoleError.apply(console, args);
      };
    </script>
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
